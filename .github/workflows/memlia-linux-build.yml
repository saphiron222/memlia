name: Mesure du build Linux 16 Go
on:
  workflow_dispatch:
  push:
    branches: [build/linux-16gb-measurement]
permissions:
  contents: read
concurrency:
  group: memlia-linux-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Vérifier les notices amont avant téléchargement
        run: |
          python3 scripts/ci/test_upstream_notices.py -v
          python3 scripts/ci/check-upstream-notices.py --root .
          python3 scripts/ci/check-upstream-notices.py --root . --history
      - name: Vérifier le superviseur
        run: python3 scripts/ci/test-linux-build-metrics.py -v
      - name: Construire le candidat et mesurer ses groupes
        shell: bash
        run: bash scripts/ci/run-linux-build.sh
      # No source, .next, source maps, raw logs, caches, dependencies or image upload.
      # Quantitative JSON receipts alone are emitted by the runner script.
