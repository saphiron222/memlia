name: Packaging Excel Linux — installation et procédure natives
on:
  workflow_dispatch:
    inputs:
      exercise_durable:
        description: Construire les cinq images exactes et qualifier le parcours Compose durable (opérateur seulement)
        required: false
        default: false
        type: boolean
      exercise_host:
        description: Qualifier le host et les UID sur la même image après les huit cas (opérateur seulement)
        required: false
        default: false
        type: boolean
      exercise_application:
        description: Composer les API natives fichier/workflow/téléchargement sur le même host (sans HTTP/Next)
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - .github/workflows/memlia-excel-linux.yml
      - packages/memlia-contracts/**
      - runtimes/excel/**
  push:
    branches: [main]
    paths:
      - .github/workflows/memlia-excel-linux.yml
      - packages/memlia-contracts/**
      - runtimes/excel/**
permissions:
  contents: read
concurrency:
  group: memlia-excel-linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  packaging:
    # Private-runner quotas must be approved before enabling metered minutes.
    if: github.event.repository.private == false && github.repository == 'saphiron222/memlia' && !inputs.exercise_durable
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PIP_CONFIG_FILE: /dev/null
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_CACHE_DIR: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      POLARS_MAX_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.15'
          architecture: x64
      - name: Préparer uniquement les roues tierces verrouillées
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          wheels="$RUNNER_TEMP/memlia-excel-third-party"
          mkdir "$wheels"
          python -I -B -m pip --isolated --disable-pip-version-check download \
            --index-url https://pypi.org/simple --no-cache-dir \
            --only-binary=:all: --no-deps --require-hashes \
            --dest "$wheels" -r runtimes/excel/requirements.lock
          python -I -B -m venv "$RUNNER_TEMP/memlia-excel-test-tools"
          "$RUNNER_TEMP/memlia-excel-test-tools/bin/python" -I -B -m pip \
            --isolated --disable-pip-version-check install \
            --no-index --no-cache-dir --no-deps --require-hashes \
            --find-links "$wheels" -r runtimes/excel/requirements.lock
      - name: Construire, contrôler et tester les deux packages locaux
        shell: bash
        env:
          MEMLIA_TEST_WHEELHOUSE: ${{ runner.temp }}/memlia-excel-third-party
        run: |
          set -euo pipefail
          # Reuses the existing native wheel integrity and installed-XLSX tests.
          # No Memlia package is resolved from an index; forged wheels are never installed.
          timeout --signal=TERM --kill-after=10s 10m \
            "$RUNNER_TEMP/memlia-excel-test-tools/bin/python" -B \
            runtimes/excel/tests/test_packaging.py -v
      - name: Vérifier la recette sans daemon supplémentaire
        shell: bash
        env:
          MEMLIA_TEST_WHEELHOUSE: ${{ runner.temp }}/memlia-excel-third-party
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 2m \
            "$RUNNER_TEMP/memlia-excel-test-tools/bin/python" -B -m unittest discover \
            -s runtimes/excel/linux -p 'test_*.py' -v
      - name: Préparer les outils applicatifs verrouillés, seulement sur demande manuelle
        if: github.event_name == 'workflow_dispatch' && inputs.exercise_application
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/memlia-excel-application"
          mkdir "$private" "$private/tools" "$private/install"
          chmod 755 "$private" "$private/tools"
          image='node:24.22.0-bookworm@sha256:14078204b6bb268c107ceff6d3c43f45a888105e5c2b18b14c32b3409d93a1b0'
          name="memlia-excel-tools-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup() {
            [[ -f "$private/install.cid" ]] || return 0
            local id found observed
            id="$(cat "$private/install.cid")"; [[ "$id" =~ ^[a-f0-9]{64}$ ]] || return 1
            found="$(timeout 10 docker container ls --all --no-trunc --quiet --filter "id=$id")" || return 1
            [[ -n "$found" ]] || return 0
            [[ "$found" == "$id" ]] || return 1
            observed="$(timeout 10 docker inspect --format '{{.Id}} {{index .Config.Labels "org.memlia.excel.tools"}}' "$id")" || return 1
            [[ "$observed" == "$id $name" ]] || return 1
            timeout 15 docker stop --time 5 "$id" > /dev/null || return 1
            timeout 10 docker rm "$id" > /dev/null || return 1
            [[ -z "$(timeout 10 docker container ls --all --no-trunc --quiet --filter "id=$id")" ]]
          }
          trap 'code=$?; cleanup || code=1; exit "$code"' EXIT
          python3 -c 'import os,shutil; assert shutil.disk_usage(os.environ["RUNNER_TEMP"]).free >= 6*1024**3'
          timeout --kill-after=10s 180s docker pull --platform linux/amd64 "$image" > "$private/node-pull.private.log" 2>&1
          curl --fail --location --silent --show-error --max-time 120 \
            https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/bun-linux-x64.zip --output "$private/bun.zip"
          printf '%s  %s\n' '36368faef7527875d5ffa52e53cd48021741f2a83eb6208a8dd64068d422a913' "$private/bun.zip" | sha256sum --check
          unzip -q "$private/bun.zip" -d "$private/tools"
          timeout --signal=TERM --kill-after=15s 960s docker run --name "$name" --cidfile "$private/install.cid" \
            --platform linux/amd64 --label "org.memlia.excel.tools=$name" --user "$(id -u):$(id -g)" \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --cpus 2 --memory 4g --memory-swap 4g --pids-limit 256 \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m --workdir /work \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/work" \
            --mount "type=bind,src=$private/tools,dst=/tools,readonly" \
            --mount "type=bind,src=$private/install,dst=/scratch" \
            --env PATH=/tools/bun-linux-x64:/usr/local/bin:/usr/bin:/bin --env HOME=/scratch --env CI=true \
            "$image" python3 -B scripts/ci/linux-build-metrics.py --phase install --timeout 900 --report /scratch/result.json -- \
            bash -ec '
              test "$(node --version)" = v24.22.0; test "$(bun --version)" = 1.4.2
              test "$(cat /sys/fs/cgroup/memory.max)" = 4294967296
              test "$(cat /sys/fs/cgroup/memory.swap.max)" = 0
              test "$(cat /sys/fs/cgroup/cpu.max)" = "200000 100000"
              test "$(cat /sys/fs/cgroup/pids.max)" = 256
              sha256sum bun.lock > /scratch/lock.sha256
              bun install --filter @sim/app --frozen-lockfile --ignore-scripts --linker hoisted
              sha256sum --check /scratch/lock.sha256
              node apps/sim/scripts/verify-oracledb-patch.cjs
              node apps/sim/scripts/oracledb-patch-self-test.cjs
              (cd node_modules/isolated-vm; node /work/node_modules/node-gyp/bin/node-gyp.js rebuild --release --jobs=2 --nodedir=/usr/local)
              cd apps/sim
              bun --no-env-file run build:cli-runtime
              bun --no-env-file run build:sandbox-bundles
              # Native request/auth guard; only its pre-auth bucket storage is doubled.
              bun test --no-env-file --tsconfig-override /work/apps/sim/tsconfig.json --timeout 10000 /work/scripts/ci/excel-file-workflow-request.test.ts
            ' > "$private/install.private.log" 2>&1
          state="$(timeout 10 docker inspect --format '{{.State.Running}} {{.State.OOMKilled}} {{.State.ExitCode}}' "$(cat "$private/install.cid")")"
          [[ "$state" == 'false false 0' ]]
          [[ "$(wc -c < "$private/install.private.log")" -le 8388608 ]]
          python3 -c 'import os,shutil; assert shutil.disk_usage(os.environ["RUNNER_TEMP"]).free >= 6*1024**3'
          git diff --exit-code
      - name: Qualifier réellement le worker isolé Linux AMD64
        shell: bash
        env:
          MEMLIA_EXERCISE_HOST: ${{ github.event_name == 'workflow_dispatch' && (inputs.exercise_host || inputs.exercise_application) && '1' || '0' }}
          MEMLIA_EXERCISE_APPLICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.exercise_application && '1' || '0' }}
        run: |
          set -euo pipefail
          umask 077
          runner=("$RUNNER_TEMP/memlia-excel-test-tools/bin/python" -B)
          extra=()
          if [[ "$MEMLIA_EXERCISE_HOST" == 1 ]]; then
            runner=(sudo -n -- /usr/bin/env RUNNER_TEMP="$RUNNER_TEMP" POLARS_MAX_THREADS=1 OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 PYTHONDONTWRITEBYTECODE=1 "$RUNNER_TEMP/memlia-excel-test-tools/bin/python" -B)
            extra=(--exercise-host)
          fi
          if [[ "$MEMLIA_EXERCISE_APPLICATION" == 1 ]]; then extra+=(--exercise-application); fi
          # Standard ephemeral public runner only; no registry login or image push.
          # Native supervisor remains unregistered: this is its explicit CI recipe.
          timeout --signal=TERM --kill-after=20s 12m \
            "${runner[@]}" \
            runtimes/excel/linux/qualification.py \
            --wheelhouse "$RUNNER_TEMP/memlia-excel-third-party" \
            --output "$RUNNER_TEMP/memlia-excel-linux-recipe" "${extra[@]}"
      # No artifacts: wheels, logs and fictitious workbooks remain on this ephemeral VM.

  durable:
    # Same public, standard runner. No external registry credentials or publication.
    if: github.event_name == 'workflow_dispatch' && inputs.exercise_durable && github.event.repository.private == false && github.repository == 'saphiron222/memlia'
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    env:
      MEMLIA_PUBLIC_RUN: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_CONFIG_FILE: /dev/null
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.15'
          architecture: x64
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.0'
      - name: Vérifier les seules nouvelles frontières de préparation
        run: python3 -B scripts/ci/test-excel-durable-ci.py -v
      - name: Préparer les roues verrouillées pour la recette native existante
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir "$RUNNER_TEMP/excel-durable-wheels"
          python -I -B -m pip --isolated --disable-pip-version-check download \
            --index-url https://pypi.org/simple --no-cache-dir --only-binary=:all: --no-deps --require-hashes \
            --dest "$RUNNER_TEMP/excel-durable-wheels" -r runtimes/excel/requirements.lock \
            > "$RUNNER_TEMP/excel-durable-wheels.private.log" 2>&1
          python -I -B -m venv "$RUNNER_TEMP/excel-durable-python"
          "$RUNNER_TEMP/excel-durable-python/bin/python" -I -B -m pip --isolated install \
            --no-index --no-cache-dir --no-deps --require-hashes --find-links "$RUNNER_TEMP/excel-durable-wheels" \
            -r runtimes/excel/requirements.lock > "$RUNNER_TEMP/excel-durable-install.private.log" 2>&1
      - name: Construire les images et qualifier une seule fois Compose durable
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Dedicated ephemeral checkout, not a host credential or existing deployment.
          sudo -n chown -R root:root "$GITHUB_WORKSPACE"
          output="/var/lib/memlia-excel-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$output"
          timeout --signal=TERM --kill-after=240s 155m sudo -n --preserve-env=GITHUB_ACTIONS,RUNNER_OS,MEMLIA_PUBLIC_RUN -- \
            "$RUNNER_TEMP/excel-durable-python/bin/python" -B scripts/ci/excel-durable-ci.py \
            --expected-commit "$GITHUB_SHA" --output "$output" --node "$(command -v node)" \
            --wheelhouse "$RUNNER_TEMP/excel-durable-wheels" \
            > "$RUNNER_TEMP/excel-durable-command.private.log" 2>&1
      - name: Publier uniquement le verdict fermé, jamais les données de recette
        if: always()
        shell: bash
        run: |
          sudo -n python3 -B - "$GITHUB_WORKSPACE" "/var/lib/memlia-excel-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" <<'PY'
          import importlib.util,json,os,stat,sys
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('ci',Path(sys.argv[1])/'scripts/ci/excel-durable-ci.py')
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          path=Path(sys.argv[2])/'summary.json'
          if not path.exists():
              print(json.dumps({'status':'failed','phase':'preflight','step':'preflight','errorCode':'unexpected_failure','cleanup':False,'imagesBuilt':0,'durableQualified':False}))
          else:
              fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK)
              with os.fdopen(fd,'rb') as f:
                  info=os.fstat(f.fileno());assert stat.S_ISREG(info.st_mode) and info.st_uid==0 and info.st_nlink==1
                  raw=f.read(4097)
              assert len(raw)<=4096
              value=json.loads(raw);assert set(value)=={'status','phase','step','errorCode','cleanup','imagesBuilt','durableQualified'}
              assert value['status'] in ('passed','failed') and value['phase'] in module.PHASES
              assert value['step'] in module.STEPS and value['errorCode'] in module.ERROR_CODES
              assert value['step']==value['phase'] or value['phase']=='contexts' and value['step'] in {'cron-assets',*('context-'+name for name in module.APPS)}
              assert (value['errorCode']=='none') == (value['status']=='passed')
              assert type(value['imagesBuilt']) is int and 0<=value['imagesBuilt']<=5
              assert type(value['cleanup']) is bool and type(value['durableQualified']) is bool
              if value['status']=='passed':
                  assert value['phase']=='complete' and value['cleanup'] and value['imagesBuilt']==5 and value['durableQualified']
              print(json.dumps(value,sort_keys=True))
          PY
      # No upload-artifact: private TLS keys, credentials, DB data, logs and XLSX
      # remain only on this ephemeral runner. Unknown application cleanup is HOLD.
