name: Expérience Linux avec swap — non qualifiée
on:
  workflow_dispatch:
  push:
    branches: [build/linux-swap-measurement]
permissions:
  contents: read
concurrency:
  group: memlia-linux-swap-${{ github.ref }}
  cancel-in-progress: false
jobs:
  measure:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        variant: [turbopack, webpack, turbopack-zram]
    env:
      MEMLIA_PUBLIC_RUN: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Vérifier la provenance et les contrôles portables
        run: |
          python3 scripts/ci/test_upstream_notices.py -v
          python3 scripts/ci/check-upstream-notices.py --root .
          python3 scripts/ci/check-upstream-notices.py --root . --history
          python3 scripts/ci/test-linux-build-metrics.py -v
          python3 scripts/ci/test-linux-swap-host.py -v
          python3 scripts/ci/test-linux-standalone-smoke.py -v
      - name: Mesurer un seul candidat froid dans cette VM
        shell: bash
        env:
          MEMLIA_VARIANT: ${{ matrix.variant }}
        run: bash scripts/ci/run-linux-build.sh --swap "$MEMLIA_VARIANT"
      - name: Lire uniquement les reçus fermés
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,math,os,stat
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'memlia-metrics'
          names=['host','toolchain','result','next-config','next-limits']
          for phase in ['test','install','inventory','typegen','typecheck','cli','sandbox','config','next','standalone']:
              names.extend([phase,phase+'-container'])
          names.append('standalone-http')
          for name in names:
              path=root/(name+'.json')
              if name == 'standalone-http':
                  if not path.exists() and not path.is_symlink(): continue
                  try:
                      # Only the fixed producer's closed receipt may cross the VM boundary.
                      if root.is_symlink() or path.is_symlink(): raise ValueError()
                      fd=os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
                      with os.fdopen(fd, 'rb') as stream:
                          if not stat.S_ISREG(os.fstat(stream.fileno()).st_mode): raise ValueError()
                          data=stream.read(4097)
                      if len(data)>4096: raise ValueError()
                      value=json.loads(data)
                      small={'status','reason','cleanup'}
                      full=small | {'health','loginHtml','assets','forcedStop','databaseQualified','authenticationQualified','seconds'}
                      reasons={'artifact_invalid','staging_refused','environment_invalid','listener_unavailable',
                               'timeout','server_exited','http_refused','health_refused','login_refused',
                               'assets_missing','asset_refused','private_log_limit','interrupted',
                               'smoke_unavailable','cleanup_failed'}
                      diagnostics={'requestStage','httpStatus'}
                      if not isinstance(value,dict) or set(value) not in (small,full,small|diagnostics,full|diagnostics): raise ValueError()
                      if value['status'] not in ('passed','failed') or type(value['cleanup']) is not bool: raise ValueError()
                      if value['reason'] is not None and (type(value['reason']) is not str or value['reason'] not in reasons): raise ValueError()
                      if diagnostics <= set(value):
                          stage,status=value['requestStage'],value['httpStatus']
                          if stage not in (None,'health','login','asset_1','asset_2'): raise ValueError()
                          if status is not None and (type(status) is not int or not 100<=status<=599): raise ValueError()
                          if stage is None and status is not None: raise ValueError()
                          if not full <= set(value) and (stage is not None or status is not None): raise ValueError()
                          if value['reason']=='http_refused' and stage is None: raise ValueError()
                      if full <= set(value):
                          if any(type(value[k]) is not bool for k in ('health','loginHtml','forcedStop','databaseQualified','authenticationQualified')): raise ValueError()
                          if value['databaseQualified'] or value['authenticationQualified']: raise ValueError()
                          if type(value['assets']) is not int or value['assets'] not in (0,2): raise ValueError()
                          if type(value['seconds']) not in (int,float) or not math.isfinite(value['seconds']) or not 0<=value['seconds']<=2**53-1: raise ValueError()
                      if value['status']=='passed':
                          if not full <= set(value) or value['reason'] is not None or not value['cleanup'] or not value['health'] or not value['loginHtml'] or value['assets']!=2: raise ValueError()
                          if diagnostics <= set(value) and (stage!='asset_2' or status!=200): raise ValueError()
                      elif value['reason'] is None: raise ValueError()
                  except Exception:
                      raise SystemExit('Invalid standalone HTTP receipt') from None
                  print(json.dumps({'phase':'standalone-http',**value},sort_keys=True,allow_nan=False))
                  continue
              if path.is_file():
                  with path.open('rb') as stream: data=stream.read(131073)
                  if len(data)>131072: raise SystemExit('Receipt exceeds publication bound')
                  print(json.dumps(json.loads(data),sort_keys=True))
          PY
      # No artifacts: raw logs, .next, maps, heap dumps and dependencies stay on the ephemeral VM.
